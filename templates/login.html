```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Librarian Login | LibraCore</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top left,
                    #dbeafe,
                    transparent 35%
                ),
                #f8fafc;
        }


        .login-wrapper {
            width: 100%;
            max-width: 430px;

            padding: 20px;
        }


        .login-card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 38px;

            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.10);
        }


        .login-logo {
            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 25px;
        }


        .login-logo-icon {
            width: 52px;
            height: 52px;

            border-radius: 13px;

            background: var(--primary);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;

            margin-right: 12px;
        }


        .login-logo-text {
            font-size: 25px;

            font-weight: 700;

            letter-spacing: -0.7px;

            color: var(--text);
        }


        .login-heading {
            text-align: center;

            margin-bottom: 28px;
        }


        .login-heading h1 {
            font-size: 22px;

            margin-bottom: 7px;
        }


        .login-heading p {
            color: var(--muted);

            font-size: 13px;

            margin: 0;
        }


        .login-form .form-group {
            margin-bottom: 18px;
        }


        .password-wrapper {
            position: relative;
        }


        .password-wrapper .form-control {
            padding-right: 70px;
        }


        .show-password {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: var(--primary);

            font-size: 11px;

            font-weight: 600;

            cursor: pointer;
        }


        .login-button {
            width: 100%;

            margin-top: 5px;

            height: 44px;
        }


        .login-footer {
            text-align: center;

            margin-top: 25px;

            color: var(--muted);

            font-size: 11px;
        }


        .login-footer strong {
            color: var(--text);
        }


        .login-error {
            display: none;

            padding: 11px 13px;

            margin-bottom: 18px;

            border-radius: 8px;

            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #991b1b;

            font-size: 12px;
        }


        .demo-info {
            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #f8fafc;

            border: 1px solid var(--border);

            text-align: center;

            font-size: 11px;

            color: var(--muted);
        }


        .demo-info strong {
            color: var(--text);
        }


        @media (max-width: 500px) {

            .login-wrapper {
                padding: 15px;
            }

            .login-card {
                padding: 28px 22px;
            }

        }

    </style>

</head>


<body>

    <div class="login-wrapper">

        <div class="login-card">

            <!-- Logo -->

            <div class="login-logo">

                <div class="login-logo-icon">
                    📚
                </div>

                <div class="login-logo-text">
                    LibraCore
                </div>

            </div>


            <!-- Heading -->

            <div class="login-heading">

                <h1>
                    Librarian Login
                </h1>

                <p>
                    Sign in to manage your library collection
                </p>

            </div>


            <!-- Error -->

            <div
                id="loginError"
                class="login-error"
            >
                Invalid username or password.
            </div>


            <!-- Login Form -->

            <form
                id="loginForm"
                class="login-form"
            >

                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="togglePassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    Sign In
                </button>

            </form>


            <!-- Demo Credentials -->

            <div class="demo-info">

                Demo Login:
                <strong>admin</strong>
                /
                <strong>admin123</strong>

            </div>


            <!-- Footer -->

            <div class="login-footer">

                <strong>LibraCore</strong>

                <br>

                Library Management System

            </div>

        </div>

    </div>


    <script>

        /* =========================================
           PASSWORD VISIBILITY
        ========================================= */

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");


        togglePassword.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    togglePassword.textContent = "Hide";

                } else {

                    passwordInput.type = "password";

                    togglePassword.textContent = "Show";

                }

            }
        );


        /* =========================================
           DEMO LOGIN
        ========================================= */

        const loginForm =
            document.getElementById("loginForm");

        const loginError =
            document.getElementById("loginError");


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const username =
                    document.getElementById("username")
                        .value
                        .trim();

                const password =
                    document.getElementById("password")
                        .value;


                if (
                    username === "admin" &&
                    password === "admin123"
                ) {

                    /*
                     * Temporary frontend login.
                     * Proper Flask session authentication
                     * will be connected later.
                     */

                    sessionStorage.setItem(
                        "librarianLoggedIn",
                        "true"
                    );

                    window.location.href = "/";

                } else {

                    loginError.style.display = "block";

                }

            }
        );


        /* =========================================
           REMOVE ERROR WHEN USER TYPES
        ========================================= */

        document
            .getElementById("username")
            .addEventListener(
                "input",
                function () {

                    loginError.style.display = "none";

                }
            );


        document
            .getElementById("password")
            .addEventListener(
                "input",
                function () {

                    loginError.style.display = "none";

                }
            );

    </script>

</body>

</html>
